# Copy to ~/.config/sillage/config.toml
# All fields are optional: a missing file uses these defaults.
# A present but invalid file intentionally prevents startup, avoiding settings
# you believe are applied when they are not.

[server]
host = "127.0.0.1"
port = 7317

[limits]
# One Claude session costs 400–500 MB RSS. This limit matters most.
# Initial value: once adjusted from Sessions, the database is authoritative.
max_concurrent_sessions = 10
# Idle runners stop, then restart with resume on the next message.
session_idle_timeout_min = 30
pty_idle_timeout_min = 60

[retention]
archived_events_days = 90

[agents.claude]
binary = "claude"
enabled = true

[agents.codex]
binary = "codex"
enabled = true

[agents.opencode]
binary = "opencode"
enabled = true

[agents.grok]
binary = "grok"
enabled = true

[agents.antigravity]
# Optional override; the built-in installer resolves its managed native archive.
# On Windows the executable is agy_acp_server.exe.
binary = "agy_acp_server.par"
enabled = true
