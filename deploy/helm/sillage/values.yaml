# Sillage chart defaults.
# All state lives in SQLite: run one instance, never two. Settings ensuring this
# (replicas fixed at 1, Recreate strategy) are intentionally not exposed here.

image:
  repository: ghcr.io/marlburrow/sillage
  # Empty = Chart appVersion. Prefer a pinned tag to `latest`: with `latest` and
  # pullPolicy IfNotPresent, recreated pods may use a cached, older node image.
  tag: ""
  pullPolicy: IfNotPresent
# For private images: [{ name: ghcr-creds }]
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 7317

ingress:
  enabled: false
  # This cluster has two controllers (`nginx`, `traefik`), neither marked default:
  # without explicit className, no controller would handle the Ingress.
  className: nginx
  annotations: {}
    # Sillage keeps WebSockets open (session streams, PTY terminals). Default
    # ingress-nginx timeout is 60 seconds, cutting idle sessions: uncomment if
    # unexpected reconnects occur.
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  host: sillage.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    # Name of kubernetes.io/tls Secret. This cluster has no cert-manager: create
    # manually (`kubectl create secret tls ...`) or install cert-manager.
    secretName: sillage-tls

# --- Storage -----------------------------------------------------------------
# Set storageClass, especially for `data`, and choose block storage over NFS:
# SQLite uses WAL and depends on file locks NFS does not reliably honor,
# leading to database corruption.
#
# Leaving this empty is not neutral. With multiple default StorageClasses,
# Kubernetes reports no error: it selects the newest. On this cluster
# (local-path and nfs-client both default), classless PVCs land on `nfs-client`,
# exactly what must be avoided. Checked with `kubectl apply --dry-run=server`.
#
# Here the correct value is `longhorn` (replicated block storage).
storage:
  data:
    # SQLite database, attachments, worktrees, interface-installed agent CLIs.
    # Required volume: without it everything is lost on restart.
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
    # Reuse an existing PVC instead of creating one (migration, restoration).
    existingClaim: ""

  # Container $HOME, where agent CLIs write credentials (~/.claude, ~/.codex,
  # ~/.local/share/opencode, where OpenCode also keeps sessions, ~/.grok for Grok
  # Build). A Secret is unsuitable: CLIs rewrite files on token refresh and
  # need writable volumes. See README for bootstrapping.
  home:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    existingClaim: ""

  # Your git repositories, referenced by Sillage projects.
  workspace:
    enabled: false
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
    existingClaim: ""

# --- Application configuration ------------------------------------------------
# Rendered into ConfigMap and passed through SILLAGE_CONFIG. Leave empty
# to use server defaults. Present but invalid configuration intentionally
# prevents startup.
config: ""
  # Exemple :
  # config: |
  #   [limits]
  #   max_concurrent_sessions = 3
  #   session_idle_timeout_min = 30
  #
  #   [retention]
  #   archived_events_days = 90

# debug | info | warn | error
logLevel: info

# Additional environment variables (list of {name, value} or valueFrom).
extraEnv: []

# --- Resources ---------------------------------------------------------------
# One Claude session costs 400–500 MB RSS; agent processes are server children
# counting toward container limit. Cover daemon (~110 MB) plus
# max_concurrent_sessions sessions. Exceeding container memory means OOMKill
# without warning.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 3Gi

# Image runs as `node` (uid 1000) with writable HOME. fsGroup aligns mounted
# volume ownership with this account.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # No readOnlyRootFilesystem: npm installs agent CLIs on demand and PTYs write /tmp.
  readOnlyRootFilesystem: false

# Migrations run before HTTP listening. Large databases take time: startupProbe
# allows up to 30 × 10 s = 5 min before failure instead of CrashLoop.
probes:
  startup:
    periodSeconds: 10
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
