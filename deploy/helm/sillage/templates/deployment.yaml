apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sillage.fullname" . }}
  labels:
    {{- include "sillage.labels" . | nindent 4 }}
spec:
  # One instance, no exposed setting requesting more: state lives in SQLite on
  # a ReadWriteOnce volume. Two write-access pods would corrupt it.
  replicas: 1
  # Recreate, not RollingUpdate: rolling would start new pod before stopping old,
  # both wanting the same RWO PVC. New one would stay Pending and migration
  # never run. Accept a brief outage.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sillage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sillage.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        {{- if .Values.config }}
        # Configuration-only changes would not change pod: hash forces restart when
        # config.toml changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Server drives PTYs and agent CLIs: allow graceful shutdown instead of
      # killing them after 30 seconds.
      terminationGracePeriodSeconds: 60
      containers:
        - name: sillage
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # Without binding 0.0.0.0, Service could never reach container.
            - name: SILLAGE_HOST
              value: "0.0.0.0"
            - name: SILLAGE_PORT
              value: "7317"
            - name: SILLAGE_DATA_DIR
              value: /home/node/.local/share/sillage
            - name: SILLAGE_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.config }}
            - name: SILLAGE_CONFIG
              value: /etc/sillage/config.toml
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7317
              protocol: TCP
          # Use /api/health, not /health: unknown routes fall back to SPA returning
          # 200 HTML. /health would therefore pass even with broken application server.
          # /api/health returns JSON without authentication.
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.storage.data.enabled }}
            - name: data
              mountPath: /home/node/.local/share/sillage
            {{- end }}
            {{- if .Values.storage.home.enabled }}
            # Mount subpaths of one volume rather than all /home/node: mounting a PVC
            # on HOME would hide directories prepared by image.
            - name: home
              mountPath: /home/node/.claude
              subPath: claude
            - name: home
              mountPath: /home/node/.codex
              subPath: codex
            # OpenCode credentials/sessions: without them conversations could not resume
            # after pod replacement.
            - name: home
              mountPath: /home/node/.local/share/opencode
              subPath: opencode
            # Connexion, sessions et binaire de Grok Build.
            - name: home
              mountPath: /home/node/.grok
              subPath: grok
            {{- end }}
            {{- if .Values.storage.workspace.enabled }}
            - name: workspace
              mountPath: /home/node/workspace
            {{- end }}
            {{- if .Values.config }}
            - name: config
              mountPath: /etc/sillage
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.storage.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sillage.claimName" (dict "ctx" . "vol" "data") }}
        {{- end }}
        {{- if .Values.storage.home.enabled }}
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "sillage.claimName" (dict "ctx" . "vol" "home") }}
        {{- end }}
        {{- if .Values.storage.workspace.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "sillage.claimName" (dict "ctx" . "vol" "workspace") }}
        {{- end }}
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ include "sillage.fullname" . }}-config
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
