apiVersion: v1
kind: Service
metadata:
  name: {{ include "sillage.fullname" . }}
  labels:
    {{- include "sillage.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.previewPort }}
      targetPort: preview
      protocol: TCP
      name: preview
  selector:
    {{- include "sillage.selectorLabels" . | nindent 4 }}
