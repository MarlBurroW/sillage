# Copy to docker-compose.yml and adjust mount paths.
#
# Agent CLIs are not in the image: install those you use through the interface
# on the first new-conversation screen. They go into the data volume and survive
# container replacement.
#
# Then authenticate: mount credential directories from host (sign in once on host
# with `claude` / `codex login` / `opencode auth login`), or use `docker exec`
# inside the container.
#
# First account (automatically administrator):
#   docker compose exec -it sillage node /app/server/cli/user-create.js
#
# Update: change image tag, then `docker compose up -d --pull always`.

services:
  sillage:
    image: ghcr.io/marlburrow/sillage:latest
    container_name: sillage
    restart: unless-stopped
    ports:
      # Server does not handle TLS: expose this port only locally or behind
      # a reverse proxy / VPN, never directly to the Internet.
      - "127.0.0.1:7317:7317"
    volumes:
      # Database, attachments, worktrees, logs, and interface-installed agent CLIs.
      # Required volume: without it, CLIs need reinstalling on every container replacement.
      - sillage-data:/home/node/.local/share/sillage
      # Config optionnelle (config.toml).
      - sillage-config:/home/node/.config/sillage
      # Agent CLI credentials shared with host.
      - ~/.claude:/home/node/.claude
      - ~/.codex:/home/node/.codex
      # OpenCode keeps credentials and sessions here: without this volume, conversations
      # could not resume after container replacement.
      - ~/.local/share/opencode:/home/node/.local/share/opencode
      # Grok Build keeps its sign-in, sessions, and binary here.
      - ~/.grok:/home/node/.grok
      # Your repositories: Sillage projects point to these paths.
      - ~/projects:/home/node/workspace

volumes:
  sillage-data:
  sillage-config:
