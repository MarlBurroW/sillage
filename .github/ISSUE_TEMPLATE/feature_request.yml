name: Idea or request
description: Something Sillage could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The situation and the need, before any solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it, if you have an idea. Screenshots or sketches are welcome.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Desktop
        - Server
        - Both
