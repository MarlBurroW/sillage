name: Runtime archive
description: >-
  Assemble l'arbre d'exécution distribué (pnpm build déjà fait), vérifie ses modules
  natifs, et l'empaquette en sillage-<version>-<platform>-<arch>.tar.gz. Partagé par la
  release et par la CI, pour que la CI éprouve exactement ce que la release publie.

inputs:
  version:
    description: Tag vX.Y.Z, ou identifiant d'un build de CI
    required: true
  platform:
    description: linux, darwin ou win32
    required: true
  arch:
    description: x64 ou arm64
    required: true

outputs:
  archive:
    description: Nom de l'archive produite, à la racine du dépôt
    value: ${{ steps.pack.outputs.archive }}

runs:
  using: composite
  steps:
    - name: Stage runtime tree
      shell: bash
      run: node scripts/stage-runtime.mjs out/sillage
      env:
        SILLAGE_VERSION: ${{ inputs.version }}
    # npm instead of pnpm produces flat node_modules without symlinks, surviving
    # tar archiving. --legacy-peer-deps because Claude SDK declares zod@^4 peer,
    # which pnpm tolerates but npm rejects. Windows skips install scripts: see
    # `desktop.yml`. Prebuilt better-sqlite3/node-pty suffice, proven below.
    - name: Install production dependencies
      shell: bash
      run: npm install --omit=dev --legacy-peer-deps ${{ inputs.platform == 'win32' && '--ignore-scripts' || '' }}
      working-directory: out/sillage
    # These optional Claude SDK packages contain only the `claude` binary, 263 MB
    # per architecture. Sillage now launches system CLI resolved through PATH and
    # always supplies `pathToClaudeCodeExecutable`, bypassing SDK resolution.
    # Keeping them would ship an unused CLI. Targeted removal instead of
    # `--omit=optional`: other optional runtime dependencies remain legitimate.
    - name: Drop the bundled Claude CLI binaries
      shell: bash
      run: rm -rf out/sillage/node_modules/@anthropic-ai/claude-agent-sdk-*
    # node-pty publishes macOS prebuild spawn-helper without execute bit: every
    # terminal would fail with “posix_spawnp failed”. Linux compiles its own.
    - name: Make node-pty's spawn-helper executable
      if: inputs.platform == 'darwin'
      shell: bash
      run: chmod +x out/sillage/node_modules/node-pty/prebuilds/darwin-*/spawn-helper
    # Migrations load better-sqlite3; a node-pty shell proves terminal functionality,
    # which merely loading the module does not.
    - name: Smoke test (native modules load, a terminal starts)
      shell: bash
      run: |
        SILLAGE_DATA_DIR="$(mktemp -d)" node out/sillage/server/cli/migrate.js
        cd out/sillage && node -e '
          const [file, args] = process.platform === "win32" ? ["cmd.exe", ["/d", "/c", "exit 3"]] : ["/bin/sh", ["-c", "exit 3"]]
          const shell = require("node-pty").spawn(file, args, {})
          shell.onExit(({ exitCode }) => process.exit(exitCode === 3 ? 0 : 1))
          setTimeout(() => process.exit(2), 10000).unref()
        '
    # macOS tar would otherwise add extended attributes as ._* archive entries.
    - name: Pack
      id: pack
      shell: bash
      run: |
        archive="sillage-${{ inputs.version }}-${{ inputs.platform }}-${{ inputs.arch }}.tar.gz"
        if [ "${{ inputs.platform }}" = darwin ]; then
          tar --no-mac-metadata --no-xattrs -czf "$archive" -C out sillage
        else
          tar -czf "$archive" -C out sillage
        fi
        echo "archive=$archive" >> "$GITHUB_OUTPUT"
