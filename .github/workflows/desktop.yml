name: Desktop

# L'application de bureau : l'arbre d'exécution de la release, le Node qui l'a construit et
# Electron, empaquetés pour chaque plateforme, puis lancés pour de vrai. Appelé par
# release.yml à chaque tag (toutes les cibles) et par la CI (Linux x64). Une fois ce
# fichier sur main, on peut aussi le lancer à la main pour une branche (Actions > Desktop
# > Run workflow) : les paquets restent alors en artefacts du run, rien n'est publié.
#
# Pas encore de signature Apple : l'app macOS est signée ad hoc, et Gatekeeper demande de
# l'autoriser à la première ouverture.

on:
  workflow_call:
    inputs:
      version:
        description: Version inscrite dans l'app (vX.Y.Z)
        required: true
        type: string
      targets:
        description: Cibles, en tableau JSON (linux-x64, linux-arm64, darwin-arm64, win-x64)
        required: false
        type: string
        default: '["linux-x64", "linux-arm64", "darwin-arm64"]'
      install-check:
        description: CLI à installer pendant le contrôle de lancement (liste séparée par des virgules)
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Version inscrite dans l'app (vX.Y.Z)
        required: false
        type: string
        default: v0.0.0-dev
      targets:
        description: Cibles, en tableau JSON (linux-x64, linux-arm64, darwin-arm64, win-x64)
        required: false
        type: string
        default: '["linux-x64", "linux-arm64", "darwin-arm64"]'
      install-check:
        description: CLI à installer pendant le contrôle de lancement (liste séparée par des virgules)
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # electron-builder télécharge son propre Electron ; celui du paquet npm ne sert qu'à
  # lancer l'app depuis le dépôt.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # Dans une PR, electron-builder saute toute signature, ad hoc comprise : l'app macOS
  # en sortirait non signée, ce qu'un Mac Apple Silicon refuse. La signature ad hoc ne
  # demande aucun secret, rien ne s'oppose à la forcer.
  CSC_FOR_PULL_REQUEST: 'true'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    # Runners natifs, comme les archives de la release : les modules natifs embarqués
    # sont compilés pour la plateforme qui les lance. ubuntu-22.04 fixe la glibc de
    # référence et laisse le bac à sable de Chromium créer ses namespaces sans profil
    # AppArmor, ce que le lancement réel de l'app demande.
    runs-on: >-
      ${{ matrix.target == 'darwin-arm64' && 'macos-15'
        || matrix.target == 'linux-arm64' && 'ubuntu-22.04-arm'
        || matrix.target == 'win-x64' && 'windows-2025'
        || 'ubuntu-22.04' }}
    env:
      PLATFORM: >-
        ${{ startsWith(matrix.target, 'darwin') && 'darwin'
          || startsWith(matrix.target, 'win') && 'win32'
          || 'linux' }}
      ARCH: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
    # Le bash de Git for Windows aussi sous Windows : les étapes sont écrites pour lui.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Ce Node installe l'arbre d'exécution et voyage avec l'app, à la version près
      # (scripts/desktop-stage.mjs) : l'app livre le couple que ce job a vérifié.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Les scripts du dépôt sont écrits pour sh (`mkdir -p`, `cp -r`), que pnpm lancerait
      # sinon dans cmd.exe.
      - name: Run package scripts with Git Bash
        if: runner.os == 'Windows'
        run: pnpm config set script-shell 'C:\Program Files\Git\bin\bash.exe'
      # Sous Windows, sans scripts d'installation : better-sqlite3 et node-pty y chargent leurs
      # binaires précompilés, et le `node-gyp rebuild` qu'impose le binding.gyp de
      # better-sqlite3 échoue sur un Visual Studio trop récent pour lui.
      - run: pnpm install --frozen-lockfile ${{ runner.os == 'Windows' && '--ignore-scripts' || '' }}
      - run: pnpm build
        env:
          SILLAGE_VERSION: ${{ inputs.version }}
      - uses: ./.github/actions/runtime-archive
        with:
          version: ${{ inputs.version }}
          platform: ${{ env.PLATFORM }}
          arch: ${{ env.ARCH }}
      - run: node scripts/desktop-stage.mjs out/sillage
      - name: Package
        working-directory: apps/desktop
        run: |
          version='${{ inputs.version }}'
          case "$PLATFORM" in darwin) os=mac ;; win32) os=win ;; *) os=linux ;; esac
          pnpm exec electron-builder "--$os" "--$ARCH" --publish never -c.extraMetadata.version="${version#v}"
      - name: Verify the macOS signature
        if: env.PLATFORM == 'darwin'
        run: codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac-arm64/Sillage.app
      # L'app empaquetée, lancée pour de vrai : serveur, session, écrans du profil de
      # bureau, garde d'origine, arrêt. Sous Linux, linux-unpacked est l'étape que
      # l'AppImage et le .deb emballent, et l'écran vient de Xvfb.
      - name: Launch check
        env:
          # Sous Windows, le contrôle installe au moins Codex par le npm embarqué : c'est là
          # que les lanceurs npm (`.cmd`) demandent d'être lus plutôt que lancés.
          SILLAGE_CHECK_INSTALL: ${{ inputs.install-check || (runner.os == 'Windows' && 'codex' || '') }}
        run: |
          if [ "$PLATFORM" = darwin ] || [ "$PLATFORM" = win32 ]; then
            node scripts/desktop-ui-check.mjs
          elif command -v xvfb-run >/dev/null; then
            xvfb-run -a node scripts/desktop-ui-check.mjs
          else
            echo "::warning::xvfb-run absent du runner, lancement non vérifié"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
