name: Desktop

# Desktop app: release runtime, Node that built it, Electron, packaged for each
# platform then launched for real. Called by release.yml on tags (all targets)
# and CI (Linux x64/Windows x64). Once on main, also manually runnable for branches
# (Actions > Desktop > Run workflow): packages remain artifacts, nothing published.
#
# No Apple signing yet: macOS app is ad hoc signed, Gatekeeper requires
# authorization on first open.

on:
  workflow_call:
    inputs:
      version:
        description: Version inscrite dans l'app (vX.Y.Z)
        required: true
        type: string
      targets:
        description: Cibles, en tableau JSON (linux-x64, linux-arm64, darwin-arm64, win-x64)
        required: false
        type: string
        default: '["linux-x64", "linux-arm64", "darwin-arm64", "win-x64"]'
      install-check:
        description: CLI à installer pendant le contrôle de lancement (liste séparée par des virgules)
        required: false
        type: string
        default: ''
      update-check:
        description: Éprouver la mise à jour de l'app, d'une version empaquetée à une autre
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Version inscrite dans l'app (vX.Y.Z)
        required: false
        type: string
        default: v0.0.0-dev
      targets:
        description: Cibles, en tableau JSON (linux-x64, linux-arm64, darwin-arm64, win-x64)
        required: false
        type: string
        default: '["linux-x64", "linux-arm64", "darwin-arm64", "win-x64"]'
      install-check:
        description: CLI à installer pendant le contrôle de lancement (liste séparée par des virgules)
        required: false
        type: string
        default: ''
      update-check:
        description: Éprouver la mise à jour de l'app, d'une version empaquetée à une autre
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # electron-builder downloads its own Electron; npm package binary only
  # launches app from repository.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  # In PRs electron-builder skips all signing, including ad hoc: macOS app would
  # be unsigned, which Apple Silicon refuses. Ad hoc signing needs no secret,
  # so it can be forced.
  CSC_FOR_PULL_REQUEST: 'true'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    # Native runners, like release archives: bundled native modules compile for
    # target platform. ubuntu-22.04 fixes baseline glibc and allows Chromium sandbox
    # namespaces without AppArmor profile, required for real app launch.
    runs-on: >-
      ${{ matrix.target == 'darwin-arm64' && 'macos-15'
        || matrix.target == 'linux-arm64' && 'ubuntu-22.04-arm'
        || matrix.target == 'win-x64' && 'windows-2025'
        || 'ubuntu-22.04' }}
    env:
      PLATFORM: >-
        ${{ startsWith(matrix.target, 'darwin') && 'darwin'
          || startsWith(matrix.target, 'win') && 'win32'
          || 'linux' }}
      ARCH: ${{ endsWith(matrix.target, 'arm64') && 'arm64' || 'x64' }}
    # Use Git for Windows bash on Windows too: steps are written for it.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # This Node installs runtime and ships with app at the exact version
      # (scripts/desktop-stage.mjs): app delivers the pair verified by this job.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Repository scripts use sh (`mkdir -p`, `cp -r`); pnpm would otherwise use cmd.exe.
      - name: Run package scripts with Git Bash
        if: runner.os == 'Windows'
        run: pnpm config set script-shell 'C:\Program Files\Git\bin\bash.exe'
      # Windows skips install scripts: better-sqlite3/node-pty load prebuilt binaries,
      # and better-sqlite3 binding.gyp forces `node-gyp rebuild`, which fails on
      # Visual Studio versions too recent for it.
      - run: pnpm install --frozen-lockfile ${{ runner.os == 'Windows' && '--ignore-scripts' || '' }}
      - run: pnpm build
        env:
          SILLAGE_VERSION: ${{ inputs.version }}
      - uses: ./.github/actions/runtime-archive
        with:
          version: ${{ inputs.version }}
          platform: ${{ env.PLATFORM }}
          arch: ${{ env.ARCH }}
      - run: node scripts/desktop-stage.mjs out/sillage
      - name: Package
        working-directory: apps/desktop
        run: |
          version='${{ inputs.version }}'
          case "$PLATFORM" in darwin) os=mac ;; win32) os=win ;; *) os=linux ;; esac
          pnpm exec electron-builder "--$os" "--$ARCH" --publish never -c.extraMetadata.version="${version#v}"
      - name: Verify the macOS signature
        if: env.PLATFORM == 'darwin'
        run: codesign --verify --deep --strict --verbose=2 apps/desktop/release/mac-arm64/Sillage.app
      # Really launch packaged app: server, session, desktop-profile screens, origin
      # guard, shutdown. Linux linux-unpacked is what AppImage/.deb wrap; Xvfb
      # provides display.
      - name: Launch check
        env:
          # Windows check installs at least Codex through bundled npm: npm `.cmd`
          # launchers must be read rather than executed here.
          SILLAGE_CHECK_INSTALL: ${{ inputs.install-check || (runner.os == 'Windows' && 'codex' || '') }}
        run: |
          if [ "$PLATFORM" = darwin ] || [ "$PLATFORM" = win32 ]; then
            node scripts/desktop-ui-check.mjs
          elif command -v xvfb-run >/dev/null; then
            xvfb-run -a node scripts/desktop-ui-check.mjs
          else
            echo "::warning::xvfb-run absent du runner, lancement non vérifié"
          fi
      # Package and install two versions, then verify discovery, download, replacement
      # and relaunch using a local HTTP feed. The .deb needs administrator permission
      # and is checked separately.
      - name: Update check
        if: inputs.update-check
        env:
          # Runners may lack FUSE; extract the AppImage instead of mounting it.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          case "$PLATFORM" in
            darwin) os=mac target=zip ;;
            win32) os=win target=nsis ;;
            *) os=linux target=AppImage ;;
          esac
          check="$RUNNER_TEMP/update-check"
          for version in 0.0.1 0.0.2; do
            (cd apps/desktop && pnpm exec electron-builder "--$os" "$target" "--$ARCH" --publish never \
              -c.extraMetadata.version="$version" -c.directories.output="$check/$version")
          done
          case "$PLATFORM" in
            darwin)
              mkdir -p "$check/Applications"
              ditto -x -k "$check"/0.0.1/Sillage-mac-*.zip "$check/Applications"
              app="$check/Applications/Sillage.app/Contents/MacOS/Sillage"
              node scripts/desktop-update-check.mjs --app "$app" --feed "$check/0.0.2"
              ;;
            win32)
              installer=$(cygpath -w "$check"/0.0.1/Sillage-win-*.exe)
              powershell -NoProfile -Command "Start-Process -Wait -FilePath '$installer' -ArgumentList '/S'"
              app=$(powershell -NoProfile -Command "(Get-ChildItem \"\$env:LOCALAPPDATA\\Programs\" -Recurse -Filter Sillage.exe | Select-Object -First 1).FullName" | tr -d '\r')
              node scripts/desktop-update-check.mjs --app "$app" --feed "$check/0.0.2"
              ;;
            *)
              mkdir -p "$check/app"
              cp "$check"/0.0.1/Sillage-linux-*.AppImage "$check/app/"
              app=$(ls "$check"/app/Sillage-linux-*.AppImage)
              xvfb-run -a node scripts/desktop-update-check.mjs --app "$app" --feed "$check/0.0.2"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
