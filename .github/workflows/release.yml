name: Release

# Publish by pushing `vX.Y.Z` tag. Build Linux (x64/arm64), macOS (arm64)
# archives with prebuilt native node_modules, multi-arch Docker image on ghcr.io,
# then GitHub release with generated notes. Desktop app (desktop.yml)
# then joins release for same platforms.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/marlburrow/sillage
  # Electron binary only launches desktop app from repository; desktop.yml
  # lets electron-builder download its own.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  tarball:
    # Native architecture runners: compiling node-pty under QEMU is slow/fragile.
    # ubuntu-22.04 fixes baseline glibc (2.35, Debian 12+). macos-15 runs Apple Silicon,
    # the only macOS target.
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SILLAGE_VERSION: ${{ github.ref_name }}
      - uses: ./.github/actions/runtime-archive
        id: archive
        with:
          version: ${{ github.ref_name }}
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error

  docker:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: SILLAGE_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-manifest:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge digests into a multi-arch manifest
        run: |
          version='${{ github.ref_name }}'
          version="${version#v}"
          cd /tmp/digests
          docker buildx imagetools create \
            -t "$IMAGE:$version" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

  release:
    needs: [tarball, docker-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      # Generated notes list PRs/commits since previous tag; application About
      # screen displays them unchanged.
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ github.ref_name }}

  desktop-publish:
    # Added after release creation without blocking it: desktop failure on one
    # platform must not withhold server or other platforms.
    needs: [release, desktop]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop
      - name: Attach the desktop app to the release
        run: |
          shopt -s nullglob
          files=(desktop/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning::aucun paquet de bureau à publier"
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
