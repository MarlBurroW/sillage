name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Electron binary only launches desktop app from repository.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm must precede setup-node because store cache key depends on it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same version as checked bindings; updates are handled explicitly.
      - run: npm install --global @openai/codex@0.163.0
      - run: pnpm codex:types:check
      # Likewise for OpenCode: script starts disposable `opencode serve` to read OpenAPI.
      - run: npm install --global opencode-ai@1.19.3
      - run: pnpm opencode:types:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  macos:
    # End-to-end macOS installation, impossible to try from Linux: release-style
    # archive, then install.sh/launchd agent on Apple Silicon Mac. Archive remains
    # an artifact for real-machine trials with SILLAGE_ARCHIVE.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unnumbered version: application offers no updates to CI builds, and
      # install.sh excludes it from release pruning.
      - name: Build identifier
        id: build
        run: echo "version=ci-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: pnpm build
        env:
          SILLAGE_VERSION: ${{ steps.build.outputs.version }}
      - uses: ./.github/actions/runtime-archive
        id: archive
        with:
          version: ${{ steps.build.outputs.version }}
          platform: darwin
          arch: arm64
      - uses: actions/upload-artifact@v4
        with:
          name: sillage-darwin-arm64
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error
      - run: scripts/macos-install-check.sh "${{ steps.archive.outputs.archive }}"
      - name: Service state and log, on failure
        if: failure()
        run: |
          launchctl print "gui/$(id -u)/io.github.marlburrow.sillage" || true
          tail -n 100 ~/.local/share/sillage/logs/sillage.log || true

  desktop:
    # Linux/Windows desktop app packaged like release and really launched: tag
    # output must not be discovered broken on release day. Windows-specific paths
    # (npm launchers, shells) cannot be tested elsewhere. Packages remain run artifacts.
    uses: ./.github/workflows/desktop.yml
    with:
      version: v0.0.0-ci
      targets: '["linux-x64", "win-x64"]'
