name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm doit être en place avant setup-node : la clé de cache du store en dépend.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Même version que les bindings relus ; une mise à jour se traite explicitement.
      - run: npm install --global @openai/codex@0.153.2
      - run: pnpm codex:types:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
