name: Pages

# Déploie le site vitrine (dossier site/) sur GitHub Pages.
# Réglage requis une fois : Settings > Pages > Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['site/**', 'install.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # L'installeur est aussi servi depuis le site : l'URL courte
      # marlburrow.github.io/sillage/install.sh reste valable.
      - run: cp install.sh site/install.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
