<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72" role="img" aria-label="Sillage">
  <!--
    Repository header. GitHub renders it as an image, without access to theme tokens:
    both modes come from a preference query, which the browser evaluates even inside
    an SVG loaded through `<img>`.

    The text stays text instead of outlines: the system font stack is enough here, and
    outlining the word would freeze it for no gain.
  -->
  <style>
    :root { --mark: #535cda; --word: #181d37; --sub: #797f99; }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #8f9bff; --word: #eceaf7; --sub: #9a97b5; }
    }
    .word {
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 30px;
      font-weight: 650;
      letter-spacing: -0.6px;
      fill: var(--word);
    }
    .sub {
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      fill: var(--sub);
    }
  </style>

  <g transform="translate(4 12) scale(.48)" fill="var(--mark)">
  <path d="M4 79C28 79 20 21 46 21H59C35 21 43 79 17 79Z" />
  <path d="M23 79C47 79 39 21 65 21H78C54 21 62 79 36 79Z" />
  <path d="M42 79C66 79 58 21 84 21H97C73 21 81 79 55 79Z" />
  </g>

  <text class="word" x="60" y="34">Sillage</text>
  <text class="sub" x="61" y="54">the wake a boat leaves on the water</text>
</svg>
