<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!--
         `maximum-scale` complements input font sizing: both are needed to prevent iOS focusing zoom
         that never resets. `viewport-fit=cover` exposes actual `env(safe-area-inset-*)` values;
         otherwise zero insets prevent spacing around device cutouts. It still cannot cover the
         entire screen: installed iOS apps retain a top-anchored viewport reduced by status-bar
         height (894 px measured on a 956 px screen). Only the root background paints the remaining
         bottom strip; see index.css.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#120d13" />
    <!--
         iOS ignores the manifest for fullscreen mode and home-screen icons. Omit
         apple-mobile-web-app-status-bar-style: black-translucent shifted the viewport upward
         without enlarging it, leaving an unreachable bottom strip retaining launch colors instead
         of following theme or appearance changes. Without this tag the status bar overlays the
         page, which paints it with the rest.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sillage" />
    <!--
         Without a declared icon browsers request /favicon.ico on each page and receive 404. Prefer
         SVG for sharp rendering at every density, retaining PNG for unsupported browsers.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Sillage</title>
    <meta
      name="description"
      content="Plateforme de développement agentique self-hosted et multi-CLI : Claude Code et Codex depuis une seule interface web."
    />
    <!-- Relative paths: every instance has its own origin, with no canonical domain to hardcode. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sillage" />
    <meta
      property="og:description"
      content="Plateforme de développement agentique self-hosted et multi-CLI : Claude Code et Codex depuis une seule interface web."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply before hydration to prevent a light-theme flash on load.
      (() => {
        const root = document.documentElement
        const stored = localStorage.getItem('sillage.theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        root.dataset.theme = stored ?? (prefersDark ? 'dark' : 'light')

        // Apply the syntax palette before hydration too, preventing initial code blocks from changing colors after appearing.
        const syntax = localStorage.getItem('sillage.syntax')
        if (syntax && syntax !== 'sillage') root.dataset.syntax = syntax

        // Keep in sync with APPEARANCE_SETTINGS (src/lib/appearance.ts): this script executes before the bundle and cannot import it.
        for (const [key, prop] of [
          ['sillage.hue', '--sg-hue'],
          ['sillage.tint', '--sg-tint'],
          ['sillage.lift', '--sg-lift'],
          ['sillage.conversationWidth', '--sg-conversation-width'],
          ['sillage.readingSize', '--sg-read-size'],
          ['sillage.readingLeading', '--sg-read-leading'],
          ['sillage.readingSoftness', '--sg-read-softness'],
          ['sillage.messageContrast', '--sg-message-contrast'],
        ]) {
          const raw = localStorage.getItem(key)
          if (raw === null) continue
          const value = Number(raw)
          if (Number.isFinite(value)) root.style.setProperty(prop, String(value))
        }

        // Sillage Desktop comes from its startup page, which shows the same mark: no delay there.
        if (window.sillageDesktop) root.dataset.boot = 'now'
      })()
    </script>
    <!--
         Startup mark, shown while the bundle loads and the session is checked; the app removes it
         with its first screen (src/lib/boot-mark.ts). A browser waits before showing it: most
         loads end sooner, and a mark that only flashes distracts more than a blank page. Same
         mark, size and place as Sillage Desktop's startup page (apps/desktop/public/splash.html),
         which this page replaces: keep the two in step.
    -->
    <style>
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
      /* The margin stands for the title under the startup page's mark. */
      #boot svg { width: 72px; height: 72px; margin-bottom: 40px; fill: var(--sg-accent, #535cda); opacity: 0; animation: boot-breathe 1.6s ease-in-out 0.6s infinite; }
      /* In Sillage Desktop, in the colours of the startup page too: the mark must not change on the way. */
      :root[data-boot='now'] #boot svg { animation-delay: 0s; fill: #535cda; }
      @media (prefers-color-scheme: dark) { :root[data-boot='now'] #boot svg { fill: #8f9bff; } }
      @keyframes boot-breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @keyframes boot-still { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation-name: boot-still; animation-duration: 1ms; animation-iteration-count: 1; animation-fill-mode: forwards; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <path d="M4 79C28 79 20 21 46 21H59C35 21 43 79 17 79Z" />
        <path d="M23 79C47 79 39 21 65 21H78C54 21 62 79 36 79Z" />
        <path d="M42 79C66 79 58 21 84 21H97C73 21 81 79 55 79Z" />
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
