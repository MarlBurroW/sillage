<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- `maximum-scale` complete la taille de police des champs : sans les deux,
         iOS zoome a la mise au point d'une saisie et ne revient jamais en arriere.

         `viewport-fit=cover` rend leurs vraies valeurs aux `env(safe-area-inset-*)`,
         sans quoi elles valent zero et l'application ne peut plus ecarter son contenu
         des encoches. Il ne suffit pas a couvrir l'ecran pour autant : une application
         installee sur iOS garde un viewport rabote de la hauteur de la barre d'etat
         (894 px mesures sur un ecran de 956) et ancre en haut. La bande qui reste en bas
         n'est peinte que par le fond de la racine, voir `index.css`. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0d1c" />
    <!-- iOS ignore le manifest pour le mode plein écran et l'icône d'accueil.

         Pas de `apple-mobile-web-app-status-bar-style`. `black-translucent` décalait le
         viewport vers le haut sans l'agrandir, laissant une bande morte en bas que
         Sillage ne pouvait pas peindre : elle gardait la couleur du lancement, donc ne
         suivait ni le thème ni les curseurs d'apparence. Sans cette balise, la barre
         d'état se pose sur la page, qui la peint avec le reste. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sillage" />
    <!-- Sans icône déclarée, le navigateur réclame /favicon.ico à chaque page et
         récolte un 404. Le SVG passe en premier, il reste net à toutes les densités ;
         le PNG reste pour les navigateurs qui ne le prennent pas. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Sillage</title>
    <meta
      name="description"
      content="Plateforme de développement agentique self-hosted et multi-CLI : Claude Code et Codex depuis une seule interface web."
    />
    <!-- Chemins relatifs : chaque instance est servie derrière sa propre origine, il n'y
         a pas de domaine canonique à écrire en dur. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sillage" />
    <meta
      property="og:description"
      content="Plateforme de développement agentique self-hosted et multi-CLI : Claude Code et Codex depuis une seule interface web."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Appliqué avant l'hydratation, sinon un flash de thème clair au chargement.
      (() => {
        const root = document.documentElement
        const stored = localStorage.getItem('sillage.theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        root.dataset.theme = stored ?? (prefersDark ? 'dark' : 'light')

        // La palette de coloration suit le meme chemin : posee avant l'hydratation,
        // sinon le premier bloc de code s'affiche dans la palette par defaut puis
        // change de couleurs sous les yeux.
        const syntax = localStorage.getItem('sillage.syntax')
        if (syntax && syntax !== 'sillage') root.dataset.syntax = syntax

        // Doit rester aligné sur APPEARANCE_SETTINGS (src/lib/appearance.ts) : ce
        // script s'exécute avant le bundle, il ne peut pas l'importer.
        for (const [key, prop] of [
          ['sillage.hue', '--sg-hue'],
          ['sillage.tint', '--sg-tint'],
          ['sillage.lift', '--sg-lift'],
          ['sillage.readingSize', '--sg-read-size'],
          ['sillage.readingLeading', '--sg-read-leading'],
          ['sillage.readingSoftness', '--sg-read-softness'],
          ['sillage.messageContrast', '--sg-message-contrast'],
        ]) {
          const raw = localStorage.getItem(key)
          if (raw === null) continue
          const value = Number(raw)
          if (Number.isFinite(value)) root.style.setProperty(prop, String(value))
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
