# Desktop application packaging.
#
# Nothing is recompiled here: `stage/` receives the release runtime and the Node
# that built it (scripts/desktop-stage.mjs); the app launches them like an installed
# service. CI passes the version from the tag (-c.extraMetadata.version).

# Same family as the macOS installer's launchd label.
appId: io.github.marlburrow.sillage
productName: Sillage
copyright: Copyright © MarlBurroW
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - package.json
# Use all of `stage/`, not `stage/sillage`: electron-builder always excludes
# node_modules at the root of a copied source, which would prevent server startup.
# One level down, it is included.
extraResources:
  - from: stage
    to: .
# No version: `releases/latest/download/<name>` always points to the latest package,
# so both the site and README can use direct download links.
artifactName: Sillage-${os}-${arch}.${ext}
publish: null
# The app has no native dependencies to rebuild for Electron: server dependencies
# run under bundled Node, not Electron.
npmRebuild: false

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # Ad hoc signature until a developer account signs it: without any signature,
  # Apple Silicon Macs refuse to launch. Hardened runtime would require a library
  # validation exception with an ad hoc signature.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    # Required by macOS when dictation opens the microphone; without it the app is killed.
    NSMicrophoneUsageDescription: Sillage uses the microphone for dictation.

win:
  # Per-user NSIS installer (AppData\Local\Programs), without administrator rights.
  # Not signed yet: SmartScreen warns at first launch.
  target:
    - nsis

linux:
  # The .deb installs an AppArmor profile: since Ubuntu 24.04, Chromium's sandbox
  # cannot create its namespaces without it and the app exits at launch.
  # AppImage installs nothing and cannot open on these systems without this profile.
  target:
    - deb
    - AppImage
  category: Development
  executableName: sillage
  # The .deb requires a maintainer; otherwise electron-builder asks for an author
  # email, which would be published in every package.
  maintainer: MarlBurroW (https://github.com/MarlBurroW/sillage)
  synopsis: Agentic development platform for Claude Code, Codex, OpenCode and Grok

deb:
  # electron-builder dependencies (getDefaultDepends, FpmTarget.js), plus git,
  # without which Sillage cannot clone, compare, or create worktrees.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - git
